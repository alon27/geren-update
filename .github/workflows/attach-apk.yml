name: Attach APK to Release

# 用途：把 APK 作为 Release 附件挂上去。
#
# 背景：部分网络环境下 uploads.github.com 不可达（该域名是 GitHub 唯一的上传通道），
#       而本 workflow 运行在 GitHub 自己的 runner 上，访问该域名没有障碍。
#       因此把它作为"上传中继"：只需要能访问 api.github.com 就能触发。
#
# 触发方式：
#   1) 手动派发（workflow_dispatch）—— 指定 tag 与源文件路径
#   2) push 形如 v* 的 tag 时自动挂载仓库根目录的 wuling-assistant.apk
#
# 用法示例：
#   gh workflow run attach-apk.yml -f tag=v57 -f asset=wuling-assistant.apk
#   gh workflow run attach-apk.yml -f tag=v41 -f asset=artifacts/v41.apk
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 Release tag（如 v57）'
        required: true
        type: string
      asset:
        description: '要挂载的 APK 路径（仓库内相对路径）。必填——不再有默认值，避免误挂无版本号旧包'
        required: true
        default: ''
        type: string
      asset_name:
        description: '挂载后的附件名（默认取源文件名）'
        required: false
        default: ''
        type: string
  # ⚠️ 2026-09-28 已移除 push tag 自动触发。
  #
  # 原触发器（push tags: v*）会在每次打 tag 时，把仓库根目录的
  # wuling-assistant.apk —— 一个无版本号的、2026-09-21 时代的旧包（16,870,701 B）
  # ——自动挂到刚发布的 Release 上。
  #
  # 后果：v27~v136 共 71 个 Release 全部多挂了这个同名旧包，用户可能误下载到
  # 数个月前的版本。清理了 3 次都复发，直到锁定是本 workflow 的自动触发所致。
  #
  # 现在只保留手动派发（workflow_dispatch），并且要求显式指定 asset 路径。

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析参数
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.asset }}" ]; then
            echo "asset=${{ inputs.asset }}" >> "$GITHUB_OUTPUT"
          else
            echo "asset=wuling-assistant.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: 挂载 APK 到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          SRC="${{ steps.meta.outputs.asset }}"
          NAME="${{ inputs.asset_name }}"
          [ -z "$NAME" ] && NAME="$(basename "$SRC")"
          echo "目标 Release : $TAG"
          echo "源文件       : $SRC"
          echo "附件名       : $NAME"
          test -f "$SRC" || { echo "::error::源文件不存在: $SRC"; exit 1; }
          # 守卫：拒绝挂载无版本号的附件名（历史 bug 根因，见文件头部说明）
          if [ "$NAME" = "wuling-assistant.apk" ]; then
            echo "::error::拒绝挂载无版本号的附件名 $NAME —— 请用 wuling-assistant-v<版本>.apk"
            exit 1
          fi
          ls -la "$SRC"
          sha256sum "$SRC"
          # 同名附件已存在时覆盖，避免重跑冲突
          gh release upload "$TAG" "$SRC#$NAME" --clobber
          echo "--- 挂载结果 ---"
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name)  \(.size) bytes"'
